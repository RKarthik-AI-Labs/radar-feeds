# radar-feeds source config
# Edit this file to add/remove sources. The daily job reads it on every run.
# Every source is fetched independently: one dead source never breaks the run.
# Check latest/status.md after a change to see whether each source worked.

# ---------------------------------------------------------------------------
# TOPICS: keyword patterns (Python regex, case-insensitive) used to tag and
# score papers and news. Weight = how much a match counts toward a paper's score.
# Keys are reused as tags in the output (e.g. "fanout" -> Fan-out).
# ---------------------------------------------------------------------------
topics:
  geo:
    label: GEO/AEO
    weight: 5
    patterns:
      - 'generative engine optimi[sz]ation'
      - '\bGEO\b'
      - 'answer engine'
      - 'AI overviews?'
      - 'AI mode'
      - 'generative search'
      - 'AI[- ]powered search'
      - '(LLM|AI)[- ]based search'
      - 'conversational search engine'
      - 'search engine optimi[sz]ation'
      - '\bSEO\b'
      - 'AI search'
      - 'Perplexity'
      - 'ChatGPT search'
      - 'SearchGPT'
  citation:
    label: Citation & source selection
    weight: 4
    patterns:
      - 'citation'
      - '\bcit(e|es|ed|ing)\b'
      - 'attribution'
      - 'source selection'
      - 'source (credibility|preference|bias)'
      - 'grounded (generation|answers?)'
      - 'web[- ]grounded'
      - 'position bias'
      - 'authority bias'
  rag:
    # Generic RAG gets a low weight on purpose: almost every cs.CL paper
    # mentions it. It only tips a paper over the bar together with a real topic.
    label: RAG (generic)
    weight: 1
    patterns:
      - 'retrieval[- ]augmented'
      - '\bRAG\b'
      - 'faithfulness'
      - 'hallucinat'
  fanout:
    label: Fan-out
    weight: 5
    patterns:
      - 'fan[- ]?out'
      - 'query decomposition'
      - 'sub[- ]?quer(y|ies)'
      - 'sub[- ]?questions?'
      - 'multi[- ]query'
      - 'query (rewriting|reformulation|expansion|generation)'
      - 'synthetic quer(y|ies)'
      - 'deep research'
      - 'search agents?'
      - 'agentic search'
  brand:
    label: Brand/product recommendation
    weight: 4
    patterns:
      - 'product recommendations?'
      - '\bbrands?\b'
      - 'vendor'
      - 'shopping'
      - 'e-?commerce'
      - 'product search'
      - 'recommend(ation|er)s? .{0,40}(LLM|language model|chatbot|ChatGPT)'
  measurement:
    label: Clicks & measurement
    weight: 3
    patterns:
      - 'zero[- ]click'
      - 'click[- ]through'
      - '\bCTR\b'
      - 'referral traffic'
      - 'user stud(y|ies)'
      - 'audit(s|ing)? of'
      - 'search behavio(u)?r'
  agents:
    label: Agents
    weight: 4
    patterns:
      - 'web agents?'
      - 'browser agents?'
      - 'browsing agents?'
      - 'agentic browser'
      - 'computer[- ]use'
      - 'GUI agents?'
      - 'WebArena|Mind2Web|WebVoyager|BrowseComp'
      - 'agent traffic'
      - '(Atlas|Comet) browser'
  crawl:
    label: Crawl
    weight: 4
    patterns:
      - 'robots\.txt'
      - 'crawlers?'
      - 'web crawl'
      - 'opt[- ]out'
      - 'pay[- ]per[- ]crawl'
      - 'bot (authentication|verification|detection)'
      - 'web bot auth'
      - 'llms\.txt'
      - 'data licensing'
      - 'GPTBot|ClaudeBot|PerplexityBot|Google-Extended|OAI-SearchBot'
  ads:
    label: Ads
    weight: 4
    patterns:
      - 'advertis'
      - 'sponsored'
      - 'ads? (in|within|inside) (LLM|chatbot|AI)'
      - 'native ads?'
      - 'product placement'
  manipulation:
    label: Manipulation
    weight: 3
    patterns:
      - 'prompt injection'
      - 'adversarial (SEO|content|attack)'
      - 'manipulat'
      - 'poison'
      - '\bspam\b'
      - 'ranking attack'

# ---------------------------------------------------------------------------
# PAPERS
# ---------------------------------------------------------------------------
papers:
  # arXiv categories pulled every run. cs.IR: every paper is listed (core).
  # Others: only papers whose title/abstract match a topic above.
  arxiv_categories:
    - {cat: cs.IR, keep_all: true, max_results: 400}
    - {cat: cs.CL, keep_all: false, max_results: 1200}
    - {cat: cs.AI, keep_all: false, max_results: 1500}
    - {cat: cs.HC, keep_all: false, max_results: 400}
    - {cat: cs.CY, keep_all: false, max_results: 300}
    - {cat: cs.SI, keep_all: false, max_results: 300}
    - {cat: cs.CR, keep_all: false, max_results: 500}
  # Extra arXiv searches across ALL categories (catches papers filed elsewhere).
  arxiv_queries:
    - 'abs:"generative engine optimization"'
    - 'abs:"AI overviews"'
    - 'abs:"answer engine"'
    - 'abs:"query fan-out"'
    - 'abs:"robots.txt"'
    - 'abs:"web agents" AND abs:"websites"'
    - 'abs:"advertising" AND abs:"large language model"'
    - 'abs:"product recommendation" AND abs:"large language model"'
  lookback_days: 5          # how far back each run looks
  min_score_non_core: 6     # a non-cs.IR paper needs at least this score to be kept
  max_with_abstract: 60     # papers.md shows abstracts for the top N new matches, titles for the rest
  fulltext_top_n: 15        # fetch full text for the N highest-scoring new papers
  fulltext_max_chars: 80000
  huggingface_daily_papers: true

# ---------------------------------------------------------------------------
# NEWS FEEDS. type: rss (feed URL; falls back to autodiscovery on `site`)
#             html (no feed: scrape links on `site` matching `link_pattern`)
# bucket: hint for the digest (labs | search | seo_press | tools | agents_crawl | b2b)
