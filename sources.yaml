  - {name: Simon Willison, type: rss, url: 'https://simonwillison.net/atom/everything/', site: 'https://simonwillison.net/', bucket: labs}
  - {name: Techmeme, type: rss, url: 'https://www.techmeme.com/feed.xml', site: 'https://www.techmeme.com/', bucket: labs}
  # Search engines (official)
  - {name: Google Search Central Blog, type: rss, url: 'https://developers.google.com/search/blog/feed.xml', site: 'https://developers.google.com/search/blog', bucket: search}
  - {name: Google Search Status Dashboard, type: rss, url: 'https://status.search.google.com/en/feed.atom', site: 'https://status.search.google.com/', bucket: search}
  - {name: Google Blog Search, type: rss, url: 'https://blog.google/products/search/rss/', site: 'https://blog.google/products/search/', bucket: search}
  - {name: Google Ads & Commerce Blog, type: rss, url: 'https://blog.google/products/ads-commerce/rss/', site: 'https://blog.google/products/ads-commerce/', bucket: search}
  - {name: Bing Webmaster Blog, type: rss, url: 'https://blogs.bing.com/webmaster/feed', site: 'https://blogs.bing.com/webmaster', bucket: search}
  - {name: Bing Search Blog, type: rss, url: 'https://blogs.bing.com/search/feed', site: 'https://blogs.bing.com/search', bucket: search}
  # SEO / search press
  - {name: Search Engine Roundtable, type: rss, url: 'https://www.seroundtable.com/index.rdf', site: 'https://www.seroundtable.com/', bucket: seo_press}
  - {name: Search Engine Land, type: rss, url: 'https://searchengineland.com/feed', site: 'https://searchengineland.com/', bucket: seo_press}
  - {name: Search Engine Journal, type: rss, url: 'https://www.searchenginejournal.com/feed/', site: 'https://www.searchenginejournal.com/', bucket: seo_press}
  - {name: PPC Land, type: rss, url: 'https://ppc.land/rss/', site: 'https://ppc.land/', bucket: seo_press}
  # Agents / crawler access
  - {name: Cloudflare Blog, type: rss, url: 'https://blog.cloudflare.com/rss/', site: 'https://blog.cloudflare.com/', bucket: agents_crawl}
  - {name: HUMAN Security Blog, type: html, site: 'https://www.humansecurity.com/learn/blog/', link_pattern: '/learn/blog/[a-z0-9-]+/?$', bucket: agents_crawl}
  - {name: DataDome Threat Research, type: html, site: 'https://datadome.co/threat-research/', link_pattern: '/threat-research/[a-z0-9-]+/?$', bucket: agents_crawl}
