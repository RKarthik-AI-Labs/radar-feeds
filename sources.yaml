  - {name: Google Developers Blog, type: rss, url: 'https://developers.googleblog.com/feeds/posts/default', site: 'https://developers.googleblog.com/', bucket: labs}
  - {name: Meta AI Blog, type: html, site: 'https://ai.meta.com/blog/', link_pattern: '/blog/[a-z0-9-]+/?$', bucket: labs}
  - {name: Mistral News, type: html, site: 'https://mistral.ai/news', link_pattern: '^/news/[a-z0-9-]+/?$', bucket: labs}
  - {name: xAI News, type: html, site: 'https://x.ai/news', link_pattern: '^/news/[a-z0-9-]+/?$', bucket: labs}
  - {name: Qwen Blog, type: rss, url: 'https://qwenlm.github.io/blog/index.xml', site: 'https://qwenlm.github.io/blog/', bucket: labs}
