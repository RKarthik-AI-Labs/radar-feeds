# ---------------------------------------------------------------------------
# NEWS SEARCHES: date-filtered news search (Google News RSS, last 2 days;
# Bing News RSS as a second engine). This is what fixes the "search tool
# has no date filter" problem for the priority sub-topics.
# ---------------------------------------------------------------------------
news_searches:
  window: 2d
  engines: [google_news, bing_news]
  queries:
    fanout:
      - '"query fan-out"'
      - '"fan-out" "AI Mode"'
      - '"synthetic queries" Google'
      - '"sub-queries" (ChatGPT OR Perplexity OR Gemini OR "AI Mode")'
    agents:
      - '"agentic browser"'
      - '"ChatGPT Atlas"'
      - '"Perplexity Comet"'
      - '"AI agent traffic" OR "agentic traffic"'
      - '"Gemini in Chrome" agent'
      - '"Copilot Mode" Edge'
    crawl:
      - '"Web Bot Auth"'
      - '"pay per crawl" OR "pay-per-crawl"'
      - '"AI crawler" OR "AI crawlers"'
      - '"robots.txt" AI'
      - '"llms.txt"'
      - 'GPTBot OR ClaudeBot OR PerplexityBot OR "OAI-SearchBot"'
      - '"AI Crawl Control"'
    ads:
      - '"ChatGPT ads"'
      - '"AI Mode" ads'
      - '"AI Overviews" ads'
      - 'Perplexity "sponsored"'
      - 'Copilot ads Microsoft'
    search:
      - '"AI Overviews"'
      - '"AI Mode" Google'
      - 'Google "core update"'
      - '"Search Console" new'
      - '"ChatGPT search"'
      - 'Perplexity search launch'
      - '"generative engine optimization" OR "answer engine optimization"'
      - '"AI visibility" tool'
      - '"LLM visibility" OR "AI search visibility"'
    labs:
      - 'OpenAI launches'
      - 'Anthropic Claude launches'
      - 'Google Gemini launches'
      - 'Meta Llama release'
      - 'xAI Grok release'
      - 'Mistral release model'
      - 'DeepSeek release model'
      - 'Qwen release model'
      - 'Moonshot Kimi model'
    b2b:
      - 'B2B buyers AI ChatGPT vendors'
      - 'B2B buying AI assistants survey'
      - 'Gartner AI agents survey'
      - 'Forrester AI B2B'
    mentions:
      - '"Karthik Ramachandiran"'
      - 'rkarthik'

# How long to keep dated archives in data/ (days).
retention_days: 21
