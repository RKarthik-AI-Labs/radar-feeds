name: Fetch radar feeds

on:
  schedule:
    # Times are UTC. arXiv announces at 20:00 US Eastern = 00:00 UTC (EDT) / 01:00 UTC (EST).
    # Paper Radar runs 01:45 UTC (07:15 IST), AI Radar 02:10 UTC (07:40 IST).
    # Two runs: the first catches the EDT announcement and overnight news, the second
    # catches the EST announcement and anything the first run missed. Odd minutes
    # avoid the top-of-hour queue on GitHub's scheduler.
    # GitHub's scheduler is best-effort: on 29 Oct both slots fired about 6 h late and on
    # 30 Oct neither fired before 01:55 UTC. Extra slots raise the odds that one runs on time;
    # the fetcher dedupes via state/seen.json, so extra runs are harmless.
    - cron: '37 0 * * *'
    - cron: '52 0 * * *'
    - cron: '17 1 * * *'
    - cron: '32 1 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'all | papers | news'
        default: 'all'
  push:
    branches: [main]
    paths:
      - 'fetch.py'
      - 'sources.yaml'
      - 'requirements.txt'
      - '.github/workflows/fetch.yml'

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch papers and news
        run: python fetch.py "${{ github.event.inputs.only || 'all' }}"

      - name: Commit results
        run: |
          git config user.name "Kiran Kowda"
          git config user.email "cipherkiran@gmail.com"
          git add latest data state
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Kolkata date +%Y-%m-%d) $(date -u +%H:%M)Z" \
                     -m "Co-authored-by: Karthik Ramachandiran <rkarthik.ace@gmail.com>"
          # If another run committed in the meantime, the generated files conflict.
          # "-X theirs" during a rebase keeps THIS run's version of conflicting
          # files (it is the newer data); code and config changes from others are kept.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Push failed after 3 attempts" && exit 1
