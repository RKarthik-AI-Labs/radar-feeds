name: Fetch radar feeds

on:
  schedule:
    # Times are UTC. arXiv announces at 20:00 US Eastern = 00:00 UTC (EDT) / 01:00 UTC (EST).
    # Paper Radar runs 01:45 UTC (07:15 IST), AI Radar 02:10 UTC (07:40 IST).
    # Two runs: the first catches the EDT announcement and overnight news, the second
    # catches the EST announcement and anything the first run missed. Odd minutes
    # avoid the top-of-hour queue on GitHub's scheduler.
    - cron: '37 0 * * *'
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'all | papers | news'
        default: 'all'
  push:
    branches: [main]
    paths:
      - 'fetch.py'
      - 'sources.yaml'
      - '.github/workflows/fetch.yml'

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch papers and news
        run: python fetch.py "${{ github.event.inputs.only || 'all' }}"

      - name: Commit results
        run: |
          git config user.name "radar-feeds bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest data state
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Kolkata date +%Y-%m-%d) $(date -u +%H:%M)Z"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "Push failed after 3 attempts" && exit 1
